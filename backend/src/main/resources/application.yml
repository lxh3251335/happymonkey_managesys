spring:
  application:
    name: project-commerce
  profiles:
    default: dev
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080
  servlet:
    session:
      timeout: 4h
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
app:
  admin-password: ${ADMIN_PASSWORD:}
  source-seed: ${SOURCE_SEED:../docs/source-seed.json}
  import-source: ${IMPORT_SOURCE:false}
