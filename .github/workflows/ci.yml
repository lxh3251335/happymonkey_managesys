name: Verify commerce platform
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run format:java:check
        working-directory: frontend
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: commerce_test
          POSTGRES_USER: commerce_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U commerce_test -d commerce_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
        working-directory: backend
      - run: mvn -B test
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/commerce_test
          TEST_DB_USER: commerce_test
          TEST_DB_PASSWORD: ci-only-password
